name: deploy docs
on:
  push:
    branches:
      - main
    paths:
      - packages/monopi__docs/**
      - docs/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: 📚 build docs
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 🟢 setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: 📦 install dependencies
        run: pnpm install --frozen-lockfile
      - name: 📚 build docs site
        run: pnpm --filter @monopi/docs build
      - name: 📤 upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/monopi__docs/dist
  deploy:
    name: 🚀 deploy docs
    permissions:
      contents: read # required for GitHub Pages deployment metadata
      pages: write # required to publish the built docs site to GitHub Pages
      id-token: write # required for GitHub Pages OIDC deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 deploy to github pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
