name: deploy docs
on:
  push:
    branches:
      - main
    paths:
      - packages/monopi__docs/**
      - docs/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: 📚 build docs
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v7.0.1 # v7
        with:
          persist-credentials: false
      - name: 📦 setup pnpm
        uses: pnpm/action-setup@v6.1.0 # v6
      - name: 🟢 setup node
        uses: actions/setup-node@v6.5.0 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: 📦 install dependencies
        run: pnpm install --frozen-lockfile
      - name: 📚 build docs site
        run: pnpm --filter @monopi/docs build
      - name: 📤 upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0 # v5
        with:
          path: packages/monopi__docs/dist
  deploy:
    name: 🚀 deploy docs
    permissions:
      contents: read # required for GitHub Pages deployment metadata
      pages: write # required to publish the built docs site to GitHub Pages
      id-token: write # required for GitHub Pages OIDC deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1 # v5
